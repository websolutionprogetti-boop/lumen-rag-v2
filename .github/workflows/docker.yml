name: docker
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Costruisce l'immagine
        run: docker build -t lumen-v2 .
      - name: Avvia il container (modalita finta, senza AWS)
        run: docker run -d -p 8000:8000 -e LUMEN_MODALITA=finto --name lumen lumen-v2
      - name: Prova l'API dentro il container
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/salute && break; sleep 1; done
          curl -sf http://localhost:8000/api/salute | grep -q '"ok"'
          curl -sf -X POST http://localhost:8000/api/chiedi -H 'content-type: application/json' \
            -d '{"domanda":"Avete il parcheggio?"}' | grep -q '"fonti"'
          echo "Immagine Docker funzionante"
      - name: Log del container in caso di errore
        if: failure()
        run: docker logs lumen
